name: Build Wheels for Termux Python 3.13

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Packages to build, space separated'
        required: true
        default: 'pydantic-core==2.23.4 greenlet==3.1.1'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build tools
        run: pip install maturin cython build

      - name: Build wheels for Android aarch64
        run: |
          for pkg in ${{ github.event.inputs.packages }}; do
            echo "Building $pkg"
            pip download --no-deps --no-binary=:all: $pkg
            pkg_dir=$(ls -d ${pkg%%==*}* | head -n1)
            cd $pkg_dir
            maturin build --release --target aarch64-linux-android
            cd..
          done

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: termux-wheels-py313
          path: '**/target/wheels/*.whl'
          retention-days: 14
