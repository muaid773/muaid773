name: Build pydantic-core 2.46.4 Android aarch64

on:
  workflow_dispatch:

env:
  PACKAGE_NAME: pydantic-core
  PACKAGE_VERSION: 2.46.4
  NDK_VERSION: '25.2.9519653'
  ANDROID_API: 24

permissions:
  contents: write 

jobs:
  build:
    name: Build arm64-v8a Py3.11
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust & Targets
        run: |
          pip install maturin
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source "$HOME/.cargo/env"
          rustup target add aarch64-linux-android

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r25b
        run: |
          yes | sdkmanager "ndk;${{ env.NDK_VERSION }}" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> $GITHUB_ENV

      - name: Build Wheel (Termux Fix)
        id: build_step
        run: |
          set -e
          source "$HOME/.cargo/env"

          PY_VER="3.11"
          ARCH="arm64-v8a"
          RUST_TARGET="aarch64-linux-android"
          CC_TARGET="aarch64-linux-android${ANDROID_API}"
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          NDK_SYSROOT="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          MOCK_DIR="$(pwd)/mock_libs"
          mkdir -p "$MOCK_DIR"
          export PATH="$NDK_BIN:$PATH"

          # Configure linker
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/${CC_TARGET}-clang"

          # Mock libpython
          "$NDK_BIN/clang" --target=$CC_TARGET -shared \
            -Wl,-soname,libpython$PY_VER.so \
            -o "$MOCK_DIR/libpython$PY_VER.so" -xc /dev/null

          cp $(find "$NDK_SYSROOT" -name "libdl.so" | grep "aarch64-linux-android" | head -n 1) "$MOCK_DIR/"

          # Sysconfig
          SYSCONFIG_NAME="_sysconfigdata__linux_${RUST_TARGET}"
          cat > "$MOCK_DIR/${SYSCONFIG_NAME}.py" <<EOF
          build_time_vars = {
              'abiflags': '', 'ABIFLAGS': '', 'SO': '.so', 'SOABI': 'cpython-$PY_VER',
              'EXT_SUFFIX': '.so', 'LIBDIR': '$MOCK_DIR', 'LDLIBRARY': 'libpython$PY_VER.so',
              'Py_ENABLE_SHARED': 1, 'CC': 'clang', 'CXX': 'clang++', 'VERSION': '$PY_VER',
              'LDSHARED': 'clang -shared', 'LDFLAGS': '-L$MOCK_DIR', 'CCSHARED': '-fPIC',
              'GNULD': 'yes', 'Py_DEBUG': 0, 'WITH_PYMALLOC': 1,
          }
          EOF

          # Download source
          mkdir -p build_src && cd build_src
          pip download "${{ env.PACKAGE_NAME }}==${{ env.PACKAGE_VERSION }}" --no-binary :all: --no-deps
          tar -xzf pydantic?core-*.tar.gz
          cd pydantic?core-*/

          # Cross-compilation env
          export PYO3_CROSS_LIB_DIR="$MOCK_DIR"
          export PYTHONPATH="$MOCK_DIR:$PYTHONPATH"
          export PYO3_CROSS_PYTHON_VERSION="$PY_VER"
          export _PYTHON_SYSCONFIGDATA_NAME="$SYSCONFIG_NAME"

          # Rust flags
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS="\
          -L native=$MOCK_DIR \
          -C link-arg=--target=$CC_TARGET \
          -C link-arg=-Wl,--no-as-needed \
          -C link-arg=-lpython$PY_VER \
          -C link-arg=-Wl,--as-needed \
          -C link-arg=-Wl,--unresolved-symbols=ignore-all \
          -C link-arg=-Wl,-rpath=/data/data/com.termux/files/usr/lib"

          maturin build --release --strip --target "$RUST_TARGET" --interpreter python$PY_VER --skip-auditwheel

          cd target/wheels
          OLD=$(ls *.whl)
          NEW=$(echo "$OLD" | sed -E "s/(-[^-]+)\.whl$/-linux_aarch64.whl/")
          mv "$OLD" "$NEW"
          echo "WHEEL_PATH=$(pwd)/$NEW" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-3.11-arm64-v8a
          path: ${{ steps.build_step.outputs.WHEEL_PATH }}
