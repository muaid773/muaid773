name: Build bcrypt wheel for Android

on:
  workflow_dispatch:

jobs:
  build-android-aarch64:
    runs-on: ubuntu-latest

    env:
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/26.1.10909125
      ANDROID_API_LEVEL: 21
      HOST: aarch64-linux-android

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Verify NDK
      run: |
        echo "NDK path: $ANDROID_NDK_HOME"
        ls -la $ANDROID_NDK_HOME
        $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang --version

    - name: Set up NDK environment variables
      run: |
        echo "CC=${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API_LEVEL}-clang" >> $GITHUB_ENV
        echo "CXX=${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API_LEVEL}-clang++" >> $GITHUB_ENV
        echo "AR=${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" >> $GITHUB_ENV
        echo "RANLIB=${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib" >> $GITHUB_ENV
        echo "STRIP=${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" >> $GITHUB_ENV
        echo "CFLAGS=-fPIC -D__ANDROID_API__=${ANDROID_API_LEVEL}" >> $GITHUB_ENV
        echo "LDFLAGS=-pie" >> $GITHUB_ENV

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel cython

    - name: Download and build bcrypt
      run: |
        pip download bcrypt==4.0.1 --no-deps --no-binary=:all:
        tar -xzf bcrypt-4.0.1.tar.gz
        cd bcrypt-4.0.1
        python setup.py bdist_wheel
        ls -la dist/

    - name: Upload wheel artifact
      uses: actions/upload-artifact@v4
      with:
        name: bcrypt-android-aarch64
        path: bcrypt-4.0.1/dist/*.whl
