name: Build bcrypt wheel for Android aarch64

on:
  workflow_dispatch:

env:
  PACKAGE_NAME: bcrypt
  PACKAGE_VERSION: 4.0.1
  NDK_VERSION: '25.2.9519653'
  ANDROID_API: 24

jobs:
  build:
    name: Build bcrypt arm64-v8a Py3.11
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r25b
        run: |
          yes | sdkmanager "ndk;${{ env.NDK_VERSION }}" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> $GITHUB_ENV

      - name: Build Wheel
        id: build_step
        run: |
          set -e
          
          PY_VER="3.11"
          ARCH="arm64-v8a"
          CC_TARGET="aarch64-linux-android${ANDROID_API}"
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          MOCK_DIR="$(pwd)/mock_libs"
          mkdir -p "$MOCK_DIR"
          export PATH="$NDK_BIN:$PATH"

          # Set compilers
          export CC="$NDK_BIN/${CC_TARGET}-clang"
          export CXX="$NDK_BIN/${CC_TARGET}-clang++"
          export AR="$NDK_BIN/llvm-ar"
          export RANLIB="$NDK_BIN/llvm-ranlib"
          export STRIP="$NDK_BIN/llvm-strip"
          
          # Flags needed for Android
          export CFLAGS="-fPIC -D__ANDROID_API__=${ANDROID_API}"
          export LDFLAGS="-pie"

          # Mock libpython so setup.py doesn't fail
          "$CC" --target=$CC_TARGET -shared \
            -Wl,-soname,libpython$PY_VER.so \
            -o "$MOCK_DIR/libpython$PY_VER.so" -xc /dev/null
          
          export LDFLAGS="$LDFLAGS -L$MOCK_DIR"

          # Download and build
          pip download "${{ env.PACKAGE_NAME }}==${{ env.PACKAGE_VERSION }}" --no-binary :all: --no-deps
          tar -xzf ${{ env.PACKAGE_NAME }}-${{ env.PACKAGE_VERSION }}.tar.gz
          cd ${{ env.PACKAGE_NAME }}-${{ env.PACKAGE_VERSION }}
          
          python setup.py bdist_wheel
          
          cd dist
          OLD=$(ls *.whl)
          NEW=$(echo "$OLD" | sed -E "s/(-[^-]+)\.whl$/-linux_aarch64.whl/")
          mv "$OLD" "$NEW"
          echo "WHEEL_PATH=$(pwd)/$NEW" >> $GITHUB_OUTPUT
          ls -la

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bcrypt-android-aarch64
          path: ${{ steps.build_step.outputs.WHEEL_PATH }}
