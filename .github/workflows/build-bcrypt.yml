name: Build bcrypt wheel for Android

on:
  workflow_dispatch: # تشغيل يدوي
  release:
    types: [published]

jobs:
  build-android-aarch64:
    runs-on: ubuntu-latest

    env:
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/26.1.10909125
      ANDROID_NDK_VERSION: 26.1.10909125
      ANDROID_API_LEVEL: 21

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Android NDK
      run: |
        sudo apt-get update
        sudo apt-get install -y unzip
        wget https://dl.google.com/android/repository/android-ndk-r26.1-linux.zip
        unzip android-ndk-r26.1-linux.zip
        sudo mv android-ndk-r26.1 /usr/local/lib/android/sdk/ndk/${ANDROID_NDK_VERSION}

    - name: Set up NDK environment
      run: |
        echo "CC=${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API_LEVEL}-clang" >> $GITHUB_ENV
        echo "CXX=${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API_LEVEL}-clang++" >> $GITHUB_ENV
        echo "AR=${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" >> $GITHUB_ENV
        echo "STRIP=${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" >> $GITHUB_ENV
        echo "HOST=aarch64-linux-android" >> $GITHUB_ENV

    - name: Install build deps
      run: |
        python -m pip install --upgrade pip setuptools wheel setuptools-rust

    - name: Download bcrypt source
      run: |
        pip download bcrypt==4.0.1 --no-deps --no-binary=:all:

    - name: Build wheel
      run: |
        tar -xzf bcrypt-4.0.1.tar.gz
        cd bcrypt-4.0.1
        python setup.py bdist_wheel

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: bcrypt-android-aarch64
        path: bcrypt-4.0.1/dist/*.whl
